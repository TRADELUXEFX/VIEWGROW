// Top-level build file.
// AGP 8.10.1 (needed for compileSdk 36) requires Gradle 8.11.1 or newer and JDK 17.
// .github/workflows/deploy.yml must install that Gradle version: see docs/deploy.yml.suggested.
plugins {
    id 'com.android.application' version '8.10.1' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
}
