plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// ViewGrow Admin: the admin's own app (package com.viewgrow.admin). Built by .github/workflows/admin.yml.
// It is installed from GitHub, never sent to Google Play. It uses the same upload key as the member app,
// so a new version installs over the old one.
def releaseKsPath = System.getenv('KEYSTORE_FILE')
def hasReleaseKs = releaseKsPath && new File(releaseKsPath).exists() && new File(releaseKsPath).length() > 0
def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '0').toInteger()

android {
    namespace 'com.viewgrow.admin'
    compileSdk 36

    defaultConfig {
        applicationId "com.viewgrow.admin"
        minSdk 24
        targetSdk 36
        versionCode 1 + runNumber
        versionName "1.0.${runNumber}"
    }

    signingConfigs {
        release {
            if (hasReleaseKs) {
                storeFile new File(releaseKsPath)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            signingConfig hasReleaseKs ? signingConfigs.release : signingConfigs.debug
            // Not shrunk: only the admin installs it, and it keeps the website bridge and the text reader simple.
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.activity:activity-ktx:1.9.1'
    // Background check for new members every 15 minutes.
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
    // Reads names from screenshots, on the phone (the text model is inside the app, no download needed).
    // Text reading comes from Google Play services (downloaded once by the phone), so the APK stays small.
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition:19.0.0'
}
