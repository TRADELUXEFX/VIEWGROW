name: Make upload keystore (run once)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create keystore and secrets file
        run: |
          PASS=$(openssl rand -hex 12)
          keytool -genkeypair -keystore viewgrow-upload.jks -storepass "$PASS" -keypass "$PASS" \
            -keyalg RSA -keysize 2048 -validity 10000 -alias viewgrow \
            -dname "CN=ViewGrow, O=ViewGrow, C=NG"
          base64 -w0 viewgrow-upload.jks > keystore_base64.txt
          printf 'KEYSTORE_PASSWORD=%s\nKEY_PASSWORD=%s\nKEY_ALIAS=viewgrow\n' "$PASS" "$PASS" > passwords.txt

      - uses: actions/upload-artifact@v4
        with:
          name: upload-keystore
          path: |
            viewgrow-upload.jks
            keystore_base64.txt
            passwords.txt
          retention-days: 1
