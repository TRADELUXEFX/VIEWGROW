name: Build
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  # 1. Unpack any zip in incoming/, apply DELETE_FILES.txt, delete the zip, commit.
  #    Then decide which app(s) to build from what changed.
  unpack:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.push.outputs.sha }}
      app: ${{ steps.what.outputs.app }}
      admin: ${{ steps.what.outputs.admin }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unpack zips from incoming/
        run: |
          shopt -s nullglob
          zips=(incoming/*.zip)
          if [ ${#zips[@]} -eq 0 ]; then echo "No zip in incoming/."; exit 0; fi
          for z in "${zips[@]}"; do
            echo "Unpacking $z"
            rm -rf /tmp/unz && mkdir -p /tmp/unz
            unzip -q -o "$z" -d /tmp/unz
            # Copy everything except protected folders and the delete list.
            [ -f /tmp/unz/DELETE_FILES.txt ] && mv /tmp/unz/DELETE_FILES.txt /tmp/DELETE_FILES.txt || rm -f /tmp/DELETE_FILES.txt
            rm -rf /tmp/unz/.git /tmp/unz/.github /tmp/unz/incoming
            cp -a /tmp/unz/. ./
            # Delete files listed in DELETE_FILES.txt (single files, protected paths skipped).
            if [ -f /tmp/DELETE_FILES.txt ]; then
              while IFS= read -r p || [ -n "$p" ]; do
                p="$(echo "$p" | tr -d '\r' | sed 's/^ *//;s/ *$//')"
                [ -z "$p" ] && continue
                case "$p" in
                  *..*|.git*|.github*|incoming*|build.gradle|app/build.gradle|admin/build.gradle|settings.gradle|gradle.properties)
                    echo "Skipped protected: $p"; continue;;
                esac
                if [ -f "$p" ]; then git rm -q "$p" && echo "Deleted $p"; fi
              done < /tmp/DELETE_FILES.txt
            fi
            git rm -q "$z"
          done
          git config user.name "deploy-bot"
          git config user.email "deploy-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy: unpack zip(s) from incoming/" && echo "Committed."

      - name: Push
        id: push
        run: |
          if [ "$(git rev-parse HEAD)" != "${{ github.sha }}" ]; then
            git pull --rebase -q origin main
            git push -q origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Decide what to build
        id: what
        run: |
          before="${{ github.event.before }}"
          if [ "${{ github.event_name }}" != "push" ] || [ -z "$before" ] || ! git cat-file -e "$before" 2>/dev/null; then
            changed="ALL"
          else
            changed="$(git diff --name-only "$before" HEAD)"
          fi
          echo "$changed"
          shared='^(build\.gradle|settings\.gradle|gradle\.properties|\.github/workflows/deploy\.yml)$'
          app=false; admin=false
          if [ "$changed" = "ALL" ] || echo "$changed" | grep -Eq "$shared|^app/"; then app=true; fi
          if [ "$changed" = "ALL" ] || echo "$changed" | grep -Eq "$shared|^admin/"; then admin=true; fi
          # Never try to build an app whose files are not in the repo yet.
          [ -f app/build.gradle ] || app=false
          { [ -f admin/build.gradle ] && grep -q "':admin'" settings.gradle; } || admin=false
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "admin=$admin" >> "$GITHUB_OUTPUT"
          echo "Build member app: $app / Build admin app: $admin"

  # 2a. Member app: AAB + APK
  member-app:
    needs: unpack
    if: needs.unpack.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.unpack.outputs.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Decode upload key
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"
      - name: Build AAB and APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease :app:bundleRelease --no-daemon
      - name: Name the files
        run: |
          mkdir -p out
          cp app/build/outputs/bundle/release/*.aab out/viewgrow-v1.0.${{ github.run_number }}.aab
          cp app/build/outputs/apk/release/*.apk out/viewgrow-v1.0.${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: viewgrow-aab
          path: out/*.aab
      - uses: actions/upload-artifact@v4
        with:
          name: viewgrow-apk
          path: out/*.apk

  # 2b. Admin app: APK
  admin-app:
    needs: unpack
    if: needs.unpack.outputs.admin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.unpack.outputs.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Decode upload key
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"
      - name: Build admin APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :admin:assembleRelease --no-daemon
      - name: Name the file
        run: |
          mkdir -p out
          cp admin/build/outputs/apk/release/*.apk out/viewgrow-admin-v1.0.${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: viewgrow-admin
          path: out/*.apk

  # 3. One GitHub release with whatever was built (up to 3 files).
  release:
    needs: [unpack, member-app, admin-app]
    if: always() && (needs.member-app.result == 'success' || needs.admin-app.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la dist
          gh release create "v1.0.${{ github.run_number }}" dist/* \
            --repo "${{ github.repository }}" \
            --target "${{ needs.unpack.outputs.sha }}" \
            --title "v1.0.${{ github.run_number }}" \
            --notes "Built from ${{ needs.unpack.outputs.sha }}"
